<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D4A017">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Lumio — Learn anything from your own materials">
  <title>Lumio — Learn Anything</title>
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="root"></div>

<!-- SVG icons -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="ic-grad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></symbol>
  <symbol id="ic-team" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="ic-game" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect x="2" y="6" width="20" height="12" rx="2"/></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="ic-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></symbol>
  <symbol id="ic-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
</svg>

<!-- Desktop Left Sidebar -->
<div id="lmLeft" style="display:none">
  <div class="ll-logo">
    <div class="ll-logomark">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span class="ll-logotxt">Lumio</span>
  </div>
  <div class="ll-sect">
    <span class="ll-lbl">Navigation</span>
    <button class="ll-btn on" id="lb0" onclick="llGo(0)"><svg><use href="#ic-book"/></svg>Subjects</button>
    <button class="ll-btn" id="lb1" onclick="llGo(1)"><svg><use href="#ic-grad"/></svg>Lesson</button>
    <button class="ll-btn" id="lb2" onclick="llGo(2)"><svg><use href="#ic-team"/></svg>Dual AI</button>
    <button class="ll-btn" id="lb3" onclick="llGo(3)"><svg><use href="#ic-game"/></svg>Games</button>
    <button class="ll-btn" id="lb4" onclick="llGo(4)"><svg><use href="#ic-user"/></svg>Profile</button>
    <div class="ll-div"></div>
    <button class="ll-btn ll-call" onclick="vcStart()" title="Start voice call with Lumio AI"><svg><use href="#ic-phone"/></svg>Call Lumio</button>
  </div>
  <div class="ll-subj">
    <div class="ll-shd">
      <span class="ll-slbl">My Subjects</span>
      <button class="ll-plus" onclick="llNew()">+</button>
    </div>
    <div id="llList"><div class="ll-empty">No subjects yet</div></div>
  </div>
</div>

<!-- Desktop Right Notes -->
<div id="lmRight" style="display:none">
  <button class="lr-tab" onclick="lrOpen()">
    <div class="lr-vert"><svg><use href="#ic-note"/></svg>NOTES</div>
  </button>
  <div class="lr-panel">
    <div class="lr-hd">
      <span class="lr-title" id="lrTitle">Notes</span>
      <button class="lr-x" onclick="lrClose()">✕</button>
    </div>
    <div class="lr-body">
      <textarea class="lr-ta" id="lrTa" placeholder="Write your notes here...&#10;&#10;• Key concepts&#10;• Definitions&#10;• Summaries" oninput="lrSave()"></textarea>
      <div class="lr-foot">
        <span class="lr-saved" id="lrSv">Start writing...</span>
        <div class="lr-btns">
          <button style="color:#4F46E5" onclick="lrDl()">Download</button>
          <button style="color:#DC2626" onclick="lrClear()">Clear</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile Notes -->
<button class="mob-fab" id="mobFab" onclick="mobOpen()">
  <svg width="18" height="18"><use href="#ic-note"/></svg>
</button>
<div class="mob-ov" id="mobOv" onclick="mobClose()"></div>
<div class="mob-npan" id="mobPan">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:#F5F3FF;border-bottom:1px solid #E5E7EB;flex-shrink:0">
    <strong style="font-size:.9rem;color:#1F2937">Notes</strong>
    <button onclick="mobClose()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:#6B7280">✕</button>
  </div>
  <textarea id="mobTa" style="flex:1;margin:12px;border:1.5px solid #E5E7EB;border-radius:9px;padding:11px;font-size:.875rem;font-family:inherit;resize:none;outline:none;line-height:1.6" placeholder="Write your notes..." oninput="mobSave()"></textarea>
  <div style="font-size:.68rem;color:#9CA3AF;text-align:right;padding:0 12px 5px" id="mobSv">Start writing...</div>
  <div style="display:flex;gap:7px;padding:0 12px 12px">
    <button onclick="mobDl()" style="flex:1;padding:7px;border-radius:7px;border:1.5px solid #E5E7EB;background:#fff;font-size:.78rem;cursor:pointer;font-weight:600;color:#4F46E5">Download</button>
    <button onclick="mobClear()" style="flex:1;padding:7px;border-radius:7px;border:1.5px solid #E5E7EB;background:#fff;font-size:.78rem;cursor:pointer;font-weight:600;color:#DC2626">Clear</button>
  </div>
</div>
<!-- Desktop Right Notes -->
<div id="lmRight" style="display:none">
  <button class="lr-tab" onclick="lrOpen()">
    <div class="lr-vert"><svg><use href="#ic-note"/></svg>NOTES</div>
  </button>
  <div class="lr-panel">
    <div class="lr-hd">
      <span class="lr-title" id="lrTitle">Notes</span>
      <button class="lr-x" onclick="lrClose()">✕</button>
    </div>
    <div class="lr-body">
      <textarea class="lr-ta" id="lrTa" placeholder="Write your notes here...&#10;&#10;• Key concepts&#10;• Definitions&#10;• Summaries" oninput="lrSave()"></textarea>
      <div class="lr-foot">
        <span class="lr-saved" id="lrSv">Start writing...</span>
        <div class="lr-btns">
          <button style="color:#4F46E5" onclick="lrDl()">Download</button>
          <button style="color:#DC2626" onclick="lrClear()">Clear</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Mobile Notes -->
<button class="mob-fab" id="mobFab" onclick="mobOpen()">
  <svg width="18" height="18"><use href="#ic-note"/></svg>
</button>
<div class="mob-ov" id="mobOv" onclick="mobClose()"></div>
<div class="mob-npan" id="mobPan">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:#F5F3FF;border-bottom:1px solid #E5E7EB;flex-shrink:0">
    <strong style="font-size:.9rem;color:#1F2937">Notes</strong>
    <button onclick="mobClose()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:#6B7280">✕</button>
  </div>
  <textarea id="mobTa" style="flex:1;margin:12px;border:1.5px solid #E5E7EB;border-radius:9px;padding:11px;font-size:.875rem;font-family:inherit;resize:none;outline:none;line-height:1.6" placeholder="Write your notes..." oninput="mobSave()"></textarea>
  <div style="font-size:.68rem;color:#9CA3AF;text-align:right;padding:0 12px 5px" id="mobSv">Start writing...</div>
  <div style="display:flex;gap:7px;padding:0 12px 12px">
    <button onclick="mobDl()" style="flex:1;padding:7px;border-radius:7px;border:1.5px solid #E5E7EB;background:#fff;font-size:.78rem;cursor:pointer;font-weight:600;color:#4F46E5">Download</button>
    <button onclick="mobClear()" style="flex:1;padding:7px;border-radius:7px;border:1.5px solid #E5E7EB;background:#fff;font-size:.78rem;cursor:pointer;font-weight:600;color:#DC2626">Clear</button>
  </div>
</div>

<!-- Voice Call -->
<style>
.vcall-btn{position:fixed;bottom:76px;right:14px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;font-size:1.2rem;cursor:pointer;box-shadow:0 3px 14px rgba(16,185,129,.4);z-index:200;display:none;align-items:center;justify-content:center}
.vcall-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.vcall-screen.on{opacity:1;pointer-events:all}
.vcall-avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative}
.vcall-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(79,70,229,.4);animation:vcR 1.5s ease-out infinite}
.vcall-ring2{position:absolute;inset:-18px;border-radius:50%;border:2px solid rgba(79,70,229,.2);animation:vcR 1.5s ease-out infinite .4s}
@keyframes vcR{0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.vcall-name{font-size:1.3rem;font-weight:700;color:#fff}
.vcall-status{font-size:.85rem;color:rgba(255,255,255,.6);text-align:center;max-width:260px}
.vcall-transcript{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;max-width:300px;width:90%;min-height:50px;color:rgba(255,255,255,.85);font-size:.88rem;line-height:1.5;text-align:center;border:1px solid rgba(255,255,255,.1)}
.vcall-mic{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;font-size:1.6rem;transition:all .2s;pointer-events:none}
.vcall-mic.listening{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 0 0 8px rgba(239,68,68,.2)}
.vcall-mic.idle{background:rgba(255,255,255,.15)}
.vcall-mic.thinking{background:linear-gradient(135deg,#4F46E5,#7C3AED)}
.vcall-end{width:52px;height:52px;border-radius:50%;background:#EF4444;border:none;cursor:pointer;font-size:1.4rem;color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.4)}
.vcall-wave{display:flex;gap:3px;align-items:center;height:20px;display:none}
.vcall-wave span{width:3px;background:rgba(255,255,255,.5);border-radius:2px;animation:vcW 1s ease-in-out infinite}
.vcall-wave span:nth-child(2){animation-delay:.1s}.vcall-wave span:nth-child(3){animation-delay:.2s}.vcall-wave span:nth-child(4){animation-delay:.3s}.vcall-wave span:nth-child(5){animation-delay:.4s}
@keyframes vcW{0%,100%{height:4px}50%{height:18px}}
</style>
<button class="vcall-btn" id="vcBtn" onclick="vcStart()" style="display:none">📞</button>
<div class="vcall-screen" id="vcScreen">
  <div class="vcall-avatar">🎓<div class="vcall-ring"></div><div class="vcall-ring2"></div></div>
  <div class="vcall-name">Lumio</div>
  <div class="vcall-status" id="vcSt">Starting call...</div>
  <div class="vcall-transcript" id="vcTxt">Connecting to Lumio...</div>
  <div style="display:flex;align-items:center;gap:28px;margin-top:8px">
    <div class="vcall-mic idle" id="vcMic">🎤</div>
    <button class="vcall-end" onclick="vcEnd()">📵</button>
  </div>
  <div class="vcall-wave" id="vcWave"><span></span><span></span><span></span><span></span><span></span></div>
  <div style="font-size:.7rem;color:rgba(255,255,255,.35);margin-top:4px">Tap 📵 to end call</div>
</div>

<!-- App Scripts -->
<script src="utils.js"></script>
<script src="app.js"></script>
<script src="desktop.js"></script>
<script src="voice.js"></script>

</body>
</html>
