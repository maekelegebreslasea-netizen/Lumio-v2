<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D4A017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Lumio — Learn anything from your own materials with AI">
<title>Lumio — Learn Anything</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#F3F5FF;--surface:#FFFFFF;--surface2:#F8FAFF;--border:#E3E8F5;
  --text:#0D1137;--muted:#6B74A2;
  --gold:#D4A017;--gold-bright:#F0C84A;--gold-bg:#FFFBEB;--gold-border:#F0C84A44;
  --indigo:#4F46E5;--indigo-bg:#EEF2FF;--indigo-border:#C7D2FE;
  --green:#10B981;--red:#EF4444;
  --shadow:0 2px 20px rgba(13,17,55,.06);--shadow-lg:0 8px 48px rgba(13,17,55,.12);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#root{height:100vh;display:flex;justify-content:center;align-items:flex-start}
.app{display:flex;flex-direction:column;height:100vh;width:100%;max-width:500px;background:var(--surface);box-shadow:var(--shadow-lg);overflow:hidden;position:relative}
/* Auth */
.auth-wrap{min-height:100vh;background:linear-gradient(160deg,#0D1137 0%,#1a1f5e 60%,#2d2060 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:36px 28px;backdrop-filter:blur(20px)}
.auth-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#F0C84A,#E07D2A);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;box-shadow:0 8px 32px rgba(240,200,74,.3)}
.auth-brand{font-family:'Syne',sans-serif;font-size:2.2rem;color:#F0C84A;text-align:center;letter-spacing:-.5px;margin-bottom:4px}
.auth-sub{font-size:.85rem;color:rgba(255,255,255,.5);text-align:center;margin-bottom:28px}
.auth-tabs{display:flex;gap:4px;background:rgba(255,255,255,.05);border-radius:14px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;color:rgba(255,255,255,.4);transition:.2s}
.auth-tab.on{background:rgba(255,255,255,.08);color:#fff}
.auth-lbl{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:block}
.auth-input{width:100%;padding:13px 15px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;font-family:'Inter',sans-serif;font-size:.95rem;outline:none;margin-bottom:13px;transition:.2s}
.auth-input::placeholder{color:rgba(255,255,255,.25)}
.auth-input:focus{border-color:#F0C84A;background:rgba(255,255,255,.08)}
.auth-btn{width:100%;padding:15px;background:linear-gradient(135deg,#F0C84A,#E07D2A);border:none;border-radius:14px;color:#000;font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:.15s}
.auth-btn:disabled{opacity:.35;cursor:not-allowed}
.auth-alert{padding:11px 14px;border-radius:12px;font-size:.83rem;margin-bottom:14px;text-align:center}
.a-err{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.a-ok{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}
/* Top */
.top{padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-brand{font-family:'Syne',sans-serif;font-size:1.25rem;color:var(--gold);letter-spacing:-.3px}
.top-chips{display:flex;gap:6px;align-items:center}
.chip{padding:5px 11px;border-radius:20px;font-size:.7rem;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;white-space:nowrap;transition:.15s}
.chip-gold{background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold)}
.chip-indigo{background:var(--indigo-bg);border:1px solid var(--indigo-border);color:var(--indigo)}
/* Nav */
.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;cursor:pointer;border:none;background:transparent;font-family:'Inter',sans-serif;position:relative}
.ni-ic{font-size:20px;opacity:.2;transition:.15s}.ni-lb{font-size:.5rem;color:#9ca3af;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.ni.on .ni-ic{opacity:1}.ni.on .ni-lb{color:var(--gold);font-weight:700}
.ni-dot{position:absolute;top:6px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;background:#22c55e;border:2px solid var(--surface)}
/* Page */
.page{flex:1;overflow-y:auto;padding:18px 16px 20px;-webkit-overflow-scrolling:touch}
.page-title{font-family:'Syne',sans-serif;font-size:1.5rem;color:var(--text);letter-spacing:-.4px;margin-bottom:4px}
.page-sub{font-size:.8rem;color:var(--muted);margin-bottom:20px}
/* Cards */
.subj-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:.15s;box-shadow:var(--shadow)}
.subj-card:active{transform:scale(.98)}
.new-card{border:2px dashed var(--border);border-radius:18px;padding:16px;margin-bottom:16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:.2s}
.new-card:hover{border-color:var(--gold);background:var(--gold-bg)}
/* Mode buttons */
.mode-btn{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;cursor:pointer;width:100%;margin-bottom:10px;text-align:left;font-family:'Inter',sans-serif;transition:.15s;box-shadow:var(--shadow)}
.mode-btn:active{transform:scale(.98)}.mode-btn:disabled{opacity:.4;cursor:not-allowed}
.mode-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
/* Materials */
.mat-row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;margin-bottom:7px}
.add-mat-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:transparent;border:2px dashed var(--border);border-radius:13px;cursor:pointer;font-family:'Inter',sans-serif;color:var(--muted);font-size:.85rem;margin-bottom:10px;transition:.2s}
.add-mat-btn:hover{border-color:var(--gold);color:var(--gold)}
/* Level */
.lvl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.lvl{padding:13px;border-radius:13px;border:1.5px solid var(--border);cursor:pointer;background:var(--surface2);text-align:left;transition:.2s}
.lvl.on{background:var(--gold-bg);border-color:var(--gold-bright)}
/* Lesson */
.lesson-page{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lesson-hdr{padding:11px 15px 9px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.msgs-area{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
/* Messages */
.msg-block{display:flex;flex-direction:column;gap:4px}
.msg-who{font-size:.62rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-left:38px;margin-bottom:2px}
.msg-row{display:flex;gap:9px;align-items:flex-end}
.msg-row.usr{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:800;font-family:'Syne',sans-serif}
.av-L{background:var(--gold-bg);border:2px solid var(--gold-border);color:var(--gold)}
.av-A{background:var(--indigo-bg);border:2px solid var(--indigo-border);color:var(--indigo)}
.av-S{background:#fff1f2;border:2px solid #fecdd3;color:#e11d48}
.av-U{background:#f0fdf4;border:2px solid #bbf7d0;color:#059669}
.bub{padding:11px 15px;border-radius:18px;font-size:.9rem;line-height:1.75;max-width:88%;word-break:break-word}
.bub-L{background:var(--gold-bg);border:1px solid var(--gold-border);border-bottom-left-radius:4px}
.bub-A{background:var(--indigo-bg);border:1px solid var(--indigo-border);color:#1e3a8a;border-bottom-left-radius:4px}
.bub-S{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-bottom-left-radius:4px}
.bub-U{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;border-bottom-right-radius:4px}
/* Typing */
.typing{display:flex;gap:5px;align-items:center;padding:11px 15px;border-radius:14px;width:fit-content}
.dp{width:6px;height:6px;border-radius:50%;animation:db 1.1s infinite ease-in-out}
.dp:nth-child(2){animation-delay:.18s}.dp:nth-child(3){animation-delay:.36s}
@keyframes db{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
.listen-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:'Inter',sans-serif;font-size:.7rem;cursor:pointer;margin-left:39px;margin-top:3px}
/* Input */
.inp-area{padding:10px 14px 8px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.inp-row{display:flex;gap:7px;align-items:flex-end}
.mic-btn{width:44px;height:44px;border-radius:50%;background:#22c55e;border:none;cursor:pointer;font-size:18px;flex-shrink:0;transition:.15s}
.mic-btn.on{background:#ef4444;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px transparent}}
.txt-inp{flex:1;padding:11px 15px;background:var(--surface2);border:1.5px solid var(--border);border-radius:22px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;resize:none;min-height:44px;max-height:80px;line-height:1.5;transition:.15s}
.txt-inp:focus{border-color:var(--gold);background:var(--surface)}
.txt-inp:disabled{opacity:.5}
.send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F0C84A,#E07D2A);border:none;cursor:pointer;font-size:18px;flex-shrink:0}
.send-btn:disabled{opacity:.3}
/* Hints */
.hints{display:flex;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.hints::-webkit-scrollbar{display:none}
.hint{padding:5px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;font-size:.72rem;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;flex-shrink:0}
/* Where panel */
.sum-box{background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:16px;padding:16px;margin-bottom:14px}
.where-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px}
.where-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:13px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.86rem;margin-bottom:8px;width:100%;text-align:left;transition:.15s;box-shadow:var(--shadow)}
.where-btn:active{transform:scale(.98)}
/* Quiz */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.opt{padding:10px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;cursor:pointer;font-size:.85rem;display:flex;gap:9px;margin-bottom:7px;line-height:1.6;transition:.15s}
.opt.sel{border-color:var(--gold);background:var(--gold-bg)}
.opt.ok{border-color:var(--green);background:#d1fae5;color:#065f46}
.opt.no{border-color:var(--red);background:#fee2e2;color:#991b1b}
.expl{margin-top:9px;padding:10px 14px;background:#f0fdf4;border-left:3px solid var(--green);border-radius:8px;font-size:.79rem;color:#065f46;line-height:1.65}
/* Flash */
.flash-card{border-radius:22px;padding:36px 24px;text-align:center;cursor:pointer;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;transition:all .25s;box-shadow:var(--shadow-lg)}
/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px 36px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.sh-title{font-family:'Syne',sans-serif;font-size:1.15rem;color:var(--gold);margin-bottom:16px;letter-spacing:-.3px}
/* Forms */
.lbl{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:block}
input[type=email],input[type=password],input[type=text],textarea{width:100%;padding:12px 15px;background:var(--surface2);border:1.5px solid var(--border);border-radius:13px;color:var(--text);font-family:'Inter',sans-serif;font-size:.94rem;outline:none;margin-bottom:13px;transition:.2s}
input:focus,textarea:focus{border-color:var(--gold);background:var(--surface)}
textarea{resize:vertical;min-height:120px;line-height:1.65}
.btn-g{width:100%;padding:14px;background:linear-gradient(135deg,#F0C84A,#E07D2A);border:none;border-radius:14px;color:#000;font-family:'Inter',sans-serif;font-weight:700;font-size:.96rem;cursor:pointer;transition:.15s}
.btn-g:disabled{opacity:.35;cursor:not-allowed}
.btn-s{padding:11px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;font-size:.87rem;transition:.15s}
.btn-r{padding:11px 18px;background:#fee2e2;border:1px solid #fca5a5;border-radius:13px;color:var(--red);font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;font-size:.87rem}
/* Emoji/color pickers */
.emoji-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.emj{width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:var(--surface2);cursor:pointer;font-size:19px;transition:.15s}
.emj.on{border-color:var(--gold);background:var(--gold-bg)}
.clr-row{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.clr{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.15s}
.clr.on{border-color:var(--text);transform:scale(1.15)}
/* Tabs */
.tab-row{display:flex;gap:5px;margin-bottom:14px}
.tb{flex:1;padding:9px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.77rem;font-weight:600;color:var(--muted);transition:.15s}
.tb.on{background:var(--gold-bg);border-color:var(--gold-bright);color:var(--gold)}
/* Drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;background:var(--surface2);transition:.2s}
.drop-zone:hover{border-color:var(--gold);background:var(--gold-bg)}
/* Spinner */
.spin{display:inline-block;border:2.5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Section title */
.sec-title{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;margin:18px 0 10px}
/* Tags */
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.69rem;font-weight:700;margin-right:5px;margin-bottom:5px}
/* XP pop */
.xp-pop{position:fixed;top:60px;right:16px;background:linear-gradient(135deg,#F0C84A,#E07D2A);color:#000;padding:6px 14px;border-radius:20px;font-weight:800;font-size:.8rem;z-index:999;animation:xpa 2.2s forwards;pointer-events:none;box-shadow:0 4px 16px rgba(240,200,74,.4)}
@keyframes xpa{0%{opacity:0;transform:scale(.8)}15%{opacity:1}80%{opacity:1;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-26px)}}
/* Progress */
.prog-bar{height:4px;background:#f0e8c0;border-radius:2px;overflow:hidden;margin-top:8px;width:150px}
.prog-fill{height:100%;background:linear-gradient(90deg,#F0C84A,#E07D2A);border-radius:2px;transition:width .5s ease}
/* Range */
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 2px 8px rgba(212,160,23,.4)}
/* Video */
.video-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:10px;box-shadow:var(--shadow)}
.video-wrap iframe{width:100%;height:210px;border:none;display:block}
/* Mastery */
.mastery-concepts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.concept-row{display:flex;align-items:center;gap:10px;font-size:.8rem}
.concept-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.concept-fill{height:100%;border-radius:3px;transition:width .5s ease}
/* Info boxes */
.info-box{padding:11px 14px;border-radius:13px;font-size:.8rem;margin-bottom:12px;line-height:1.6}
.info-warn{background:#fff3cd;border:1px solid #ffc107;color:#856404}
.info-tip{background:var(--indigo-bg);border:1px solid var(--indigo-border);color:var(--indigo)}
.info-ok{background:#d1fae5;border:1px solid #6ee7b7;color:#065f46}
/* Loading */
.loading-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-n{font-family:'Syne',sans-serif;font-size:2rem;color:var(--gold);line-height:1;margin-bottom:4px}
.stat-l{font-size:.7rem;color:var(--muted)}
/* Back button */
.back-btn{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:.8rem;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px}
/* Toast notifications */
.toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{padding:12px 16px;border-radius:14px;font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 4px 24px rgba(0,0,0,.12);animation:toast-in .25s ease;pointer-events:all}
@keyframes toast-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.toast-err{background:#fff;border:1.5px solid #fca5a5;color:#dc2626}
.toast-ok{background:#fff;border:1.5px solid #6ee7b7;color:#059669}
.toast-info{background:#fff;border:1.5px solid var(--indigo-border);color:var(--indigo)}
.toast-warn{background:#fff;border:1.5px solid #fde68a;color:#92400e}
/* Usage bar */
.usage-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:.69rem;color:var(--muted);margin-bottom:12px}
.usage-fill-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.usage-fill{height:100%;border-radius:2px;transition:width .4s}
/* Upgrade modal */
.upgrade-box{background:linear-gradient(135deg,#0D1137,#1a1f5e);border-radius:20px;padding:24px;margin-bottom:16px;color:#fff}
/* Offline banner */
.offline-banner{background:#374151;color:#fff;padding:8px 14px;font-size:.78rem;text-align:center;font-weight:600;flex-shrink:0}
@media(min-width:768px){clamp(360px,92vw,960px)}}
</style>
</head>
<body>
<div id="root"></div>

// ── Voice ─────────────────────────────────────────────────────────
let voiceList=[],cachedVoices={},voiceUnlocked=false,iosTimer=null;
function loadVoices(){voiceList=window.speechSynthesis?.getVoices()||[];cachedVoices={}}
if(window.speechSynthesis){setTimeout(loadVoices,600);window.speechSynthesis.onvoiceschanged=loadVoices}

function unlockVoice(){
  if(voiceUnlocked||!window.speechSynthesis)return;
  voiceUnlocked=true;
  const u=new SpeechSynthesisUtterance(" ");u.volume=0;u.rate=10;
  window.speechSynthesis.speak(u);
  if(!iosTimer)iosTimer=setInterval(()=>{
    if(window.speechSynthesis?.speaking){window.speechSynthesis.pause();window.speechSynthesis.resume()}
  },10000);
}

function getBestVoice(gender,lang){
  const key=gender+"-"+lang;
  if(cachedVoices[key])return cachedVoices[key];
  if(!voiceList.length)voiceList=window.speechSynthesis?.getVoices()||[];
  const sh=(lang||"en-US").slice(0,2).toLowerCase();
  let pool=voiceList.filter(v=>v.lang.toLowerCase().startsWith(sh));
  if(!pool.length)pool=voiceList.filter(v=>v.lang.startsWith("en"));
  if(!pool.length)pool=voiceList.slice(0,5);
  let v=gender==="male"
    ?pool.find(v=>/male|man|david|mark|daniel|jorge|henrik|aaron|fred/i.test(v.name))||(pool.length>1?pool[1]:pool[0])
    :pool.find(v=>/female|woman|samantha|victoria|karen|alva|anna|alice|moira/i.test(v.name))||pool[0];
  cachedVoices[key]=v;return v;
}

// iOS voice fix: split into sentences, speak sequentially
var _sq=[],_sg="female",_sl="en-US",_sr=1;
var _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
function _splitText(t){
  var c=t.replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\s+/g," ").trim();
  var p=c.match(/[^.!?]{1,160}[.!?]?/g)||[c];
  return p.map(function(s){return s.trim()}).filter(function(s){return s.length>2});
}
function _next(){
  if(!_sq.length||!window.speechSynthesis)return;
  var txt=_sq.shift();if(!txt){_next();return;}
  try{
    var u=new SpeechSynthesisUtterance(txt);
    var v=getBestVoice(_sg,_sl);
    if(v){u.voice=v;u.lang=v.lang;}else{u.lang=_sl;}
    u.rate=Math.max(0.5,Math.min(2,_sr*0.9));
    u.pitch=_sg==="male"?0.85:1.05;u.volume=1;
    u.onend=function(){setTimeout(_next,150)};
    u.onerror=function(){setTimeout(_next,150)};
    if(_isIOS){window.speechSynthesis.pause();window.speechSynthesis.resume();}
    window.speechSynthesis.speak(u);
  }catch{setTimeout(_next,200)}
}
function speak(text,gender,lang,rate){
  if(!window.speechSynthesis||!text)return;
  try{
    window.speechSynthesis.cancel();
    _sq=[];_sg=gender||"female";_sl=lang||"en-US";_sr=rate||1;
    _sq=_splitText(text);
    setTimeout(_next,100);
  }catch{}
}

// ── AI — calls Netlify function (no API key needed in browser) ────
async function callAI(system,messages,tries=3){
  // Get Supabase auth token to identify the user (for usage tracking)
  let token=null;
  try{
    const s=await getSupa().auth.getSession();
    token=s.data?.session?.access_token||null;
  }catch{}

  for(let i=0;i<tries;i++){
    try{
      const r=await fetch("/.netlify/functions/chat",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          ...(token&&{"Authorization":"Bearer "+token})
        },
        body:JSON.stringify({system,messages,maxTokens:600})
      });

      // Daily limit reached
      if(r.status===429){
        const d=await r.json().catch(()=>({}));
        if(d.code==="DAILY_LIMIT")throw new Error("LIMIT:"+( d.error||"Daily limit reached"));
        if(i<tries-1){await sleep(8000*(i+1));continue}
        throw new Error(d.error||"For många förfrågningar. Vänta 30 sekunder.");
      }

      if(!r.ok){
        const d=await r.json().catch(()=>({}));
        throw new Error(d.error||"Fel "+r.status);
      }

      const d=await r.json();
      if(d.error)throw new Error(d.error);
      return d.text;

    }catch(e){
      if(e.message.startsWith("LIMIT:"))throw e;
      if(!navigator.onLine)throw new Error("Ingen internetuppkoppling.");
      if(i===tries-1)throw e;
      await sleep(2000);
    }
  }
}

// Vision call — prepends image materials
async function callAIVision(system,messages,imageMats=[],tries=3){
  let apiMessages=[...messages];
  if(imageMats.length>0){
    const imgContent=imageMats.map(img=>({
      type:"image",source:{type:"base64",media_type:img.mimeType||"image/jpeg",data:img.b64}
    }));
    imgContent.push({type:"text",text:"These are the visual study materials the student uploaded. Use them as primary teaching reference."});
    apiMessages=[
      {role:"user",content:imgContent},
      {role:"assistant",content:"I can see all the visual materials clearly. I will reference them in my teaching."},
      ...messages
    ];
  }
  return callAI(system,apiMessages,tries);
}

function parseJSON(raw){
  try{
    const s=raw.replace(/```json/gi,"").replace(/```/gi,"").trim();
    let i=s.indexOf("{"),i2=s.indexOf("[");
    if(i===-1&&i2===-1)return null;
    if(i===-1)i=i2;else if(i2!==-1&&i2<i)i=i2;
    return JSON.parse(s.slice(i));
  }catch{return null}
}

function hl(t){
  if(!t)return"";
  return t.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#92400e">$1</strong>').replace(/\n/g,"<br/>");

// ── Mastery ───────────────────────────────────────────────────────
const mastery={
  get:sid=>S.get("m_"+sid)||{pct:0,concepts:{}},
  set:(sid,d)=>S.set("m_"+sid,d),
  afterLesson(sid){const d=mastery.get(sid);d.pct=Math.min(100,d.pct+5);mastery.set(sid,d);return d.pct},
  afterQuiz(sid,questions,answers){
    const d=mastery.get(sid);
    const correct=questions.filter((q,i)=>answers[i]===q.answer).length;
    const score=Math.round(correct/questions.length*100);
    d.pct=Math.min(100,Math.round(d.pct*0.55+score*0.45));
    questions.forEach((q,i)=>{
      const k=(q.q||"").slice(0,40);
      d.concepts[k]=Math.max(0,Math.min(100,(d.concepts[k]||0)+(answers[i]===q.answer?22:-8)));
    });
    mastery.set(sid,d);return d.pct;
  },
  afterFlash(sid,total,known){
    const d=mastery.get(sid);
    d.pct=Math.min(100,Math.round(d.pct*0.7+(known/total)*30));
    mastery.set(sid,d);return d.pct;
  }
};

// ── File reading ──────────────────────────────────────────────────
const readTextFile=file=>new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(file)});

async function readPdfFile(file){
  if(!window.pdfjsLib)return"PDF kunde inte läsas. Klistra in texten manuellt.";
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
        let text="";const pages=Math.min(pdf.numPages,50);
        for(let i=1;i<=pages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text+=c.items.map(it=>it.str).join(" ")+"\n"}
        res(text.trim()||"Texten kunde inte extraheras. Klistra in manuellt.");
      }catch{res("PDF-fel. Klistra in texten manuellt.")}
    };
    r.onerror=()=>res("Kunde inte läsa filen.");
    r.readAsArrayBuffer(file);
  });
}

async function readDocxFile(file){
  if(!window.mammoth)return"Word-fil kunde inte läsas. Klistra in texten manuellt.";
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const result=await mammoth.extractRawText({arrayBuffer:e.target.result});
        const text=result.value.trim();
        res(text||"Kunde inte extrahera text från Word-filen. Klistra in texten manuellt.");
      }catch{res("Word-fel. Klistra in texten manuellt.")}
    };
    r.onerror=()=>res("Kunde inte läsa filen.");
    r.readAsArrayBuffer(file);
  });
}

async function readMat(file){
  const isImg=file.type.startsWith("image/");
  const isDocx=file.type==="application/vnd.openxmlformats-officedocument.wordprocessingml.document"||file.name.endsWith(".docx");
  const isDoc=file.type==="application/msword"||file.name.endsWith(".doc");
  if(isImg)return new Promise(res=>{const r=new FileReader();r.onload=e=>res({kind:"image",mimeType:file.type,b64:e.target.result.split(",")[1],name:file.name,text:""});r.readAsDataURL(file)});
  if(file.type==="application/pdf"){const text=await readPdfFile(file);return{kind:"text",text,name:file.name}}
  if(isDocx){const text=await readDocxFile(file);return{kind:"text",text,name:file.name}}
  if(isDoc)return{kind:"text",text:"Gamla .doc-filer stöds ej. Spara som .docx eller klistra in texten.",name:file.name};
  const text=await readTextFile(file);return{kind:"text",text,name:file.name};
}

function getYouTubeId(url){
  if(!url)return null;
  const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\s?#]+)/);
  return m?m[1]:null;
}

function buildHist(msgs){
  const hist=[];
  for(const m of msgs){
    const role=m.role==="user"?"user":"assistant";
    if(hist.length&&hist[hist.length-1].role===role){hist[hist.length-1].content+=" "+m.text;continue}
    hist.push({role,content:m.text});
  }
  while(hist.length&&hist[0].role!=="user")hist.shift();
  while(hist.length&&hist[hist.length-1].role!=="user")hist.pop();
  return hist.length?hist:null;
}

// ── Mic hook ──────────────────────────────────────────────────────
function useMic(onResult,langCode){
  const[on,setOn]=useState(false);
  const ref=useRef(null);
  const start=useCallback(()=>{
    if(on){try{ref.current?.stop()}catch{}setOn(false);return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Röstinmatning kräver Chrome.");return}
    try{
      const r=new SR();ref.current=r;
      r.lang=langCode||"en-US";r.continuous=false;r.interimResults=false;
      r.onstart=()=>setOn(true);r.onend=()=>setOn(false);
      r.onerror=e=>{setOn(false);if(e.error==="not-allowed")alert("Mikrofon blockerad. Tillåt den i webbläsarinställningarna.")};
      r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript;setOn(false);if(t)onResult(t)};
      r.start();
    }catch{setOn(false)}
  },[on,onResult,langCode]);
  return[on,start];
}

  async function onFile(e){
    const files=Array.from(e.target.files||[]);
    if(!files.length||!active||!user)return;
    e.target.value="";setUploading(true);
    for(const f of files){
      try{
        if(f.size>5*1024*1024){addToast(f.name+" är för stor (max 5MB). Klistra in texten istället.","warn");continue}
        const data=await readMat(f);
        const mat={id:uid(),name:f.name,kind:data.kind,text:data.text||""};
        if(data.kind==="image"&&data.b64)setBins(p=>({...p,[mat.id]:{kind:"image",mimeType:data.mimeType,b64:data.b64}}));
        await db.saveMat(mat,active.id,user.id);
        await updateMats(active.id,[...getMats(),mat]);
        addToast(f.name+" tillagd ✓","ok");
      }catch(err){addToast("Fel vid uppladdning: "+err.message)}
    }
    setUploading(false);setShowAddMat(false);

  async function genSpeedQuiz(){
    if(!active)return;
    setSpeedLoad(true);setSpeedQ(null);setSpeedIdx(0);setSpeedAns(null);setSpeedScore(0);setSpeedDone(false);
    const mt=matText(getMats());
    if(!mt){setSpeedQ({error:"Ladda upp material först."});setSpeedLoad(false);return}
    try{
      const raw=await callAI("Return only valid JSON.",[{role:"user",content:`Generate 10 multiple choice questions in ${lang} for "${active.name}". JSON: {"questions":[{"q":"?","correct":"right","wrong1":"w","wrong2":"w","wrong3":"w"}]}. Materials:\n${mt.slice(0,4000)}`}]);
      let p=parseJSON(raw);
      if(p?.questions)p.questions=p.questions.map(q=>{
        const opts=[q.correct,q.wrong1,q.wrong2,q.wrong3].filter(Boolean);
        for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
        return{q:q.q,correct:q.correct,options:opts};
      });
      setSpeedQ(p?.questions?p:{error:"Kunde inte generera."});
      if(p?.questions)addXP(5,"+5 XP ⚡");
    }catch(e){setSpeedQ({error:"Något gick fel."});handleAIError(e)}
    setSpeedLoad(false);
  }

  function answerSpeed(opt){
    if(speedAns!==null)return;
    const isCorrect=opt===speedQ.questions[speedIdx].correct;
    setSpeedAns(opt);

    setTimeout(()=>{
      if(speedIdx+1>=speedQ.questions.length)setSpeedDone(true);
      else{setSpeedIdx(i=>i+1);setSpeedAns(null)}
    },900);
  }

            h("div",{style:{height:6,background:"#F3F5FF",borderRadius:3,marginBottom:16,overflow:"hidden"}},
              h("div",{style:{height:"100%",background:"linear-gradient(90deg,#F0C84A,#E07D2A)",borderRadius:3,width:(speedIdx/speedQ.questions.length*100)+"%",transition:"width .3s"}})

            h("div",{style:{background:"#fff",border:"1px solid #E3E8F5",borderRadius:18,padding:"22px 17px",marginBottom:16,minHeight:80,display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center",boxShadow:"0 2px 20px rgba(0,0,0,.05)"}},

            ),
            h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
              speedQ.questions[speedIdx].options.map((opt,i)=>{
                const isCorrect=opt===speedQ.questions[speedIdx].correct;
                const isSelected=speedAns===opt;
                let bg="#fff",border="1px solid #E3E8F5",color="#0D1137";
                if(speedAns!==null){if(isCorrect){bg="#d1fae5";border="2px solid #10B981";color="#065f46";}else if(isSelected){bg="#fee2e2";border="2px solid #EF4444";color="#991b1b";}}

              })

            h("div",{style:{fontFamily:"Syne,sans-serif",fontSize:"1.5rem",color:"#D4A017",marginBottom:6,letterSpacing:"-.3px"}},speedScore>=8?t("excellent"):speedScore>=5?t("wellDone"):t("keepPracticing")),
            h("div",{style:{color:"#6B74A2",fontSize:".88rem",marginBottom:22}},speedScore+" / "+speedQ.questions.length+" rätt"),

              h("button",{className:"btn-g",style:{width:"auto",padding:"12px 22px"},onClick:()=>setGameMode("menu")},"Tillbaka")

      // ── QUIZ ──────────────────────────────────────────────────────
      tab==="quiz"&&h("div",{className:"page"},

        active?h(F,null,
          h("div",{className:"lvl-grid"},LEVELS.map(l=>h("div",{key:l.id,className:"lvl "+(qLvl===l.id?"on":""),onClick:()=>setQLvl(l.id)},h("div",{style:{fontSize:".85rem",fontWeight:700,marginBottom:2,color:qLvl===l.id?"#D4A017":undefined}},l.l),h("div",{style:{fontSize:".7rem",color:"#6B74A2"}},l.d)))),
          h("button",{className:"btn-g",style:{marginBottom:14},disabled:qLoad||!hasMats,onClick:()=>genQuiz(qLvl)},qLoad?t("generating"):"Generera prov"),

            q.options.map((o,oi)=>{
              let c="opt";
              if(qAns[qi]===oi)c+=" sel";
              if(qDone){if(oi===q.answer)c="opt ok";else if(qAns[qi]===oi)c="opt no"}
              return h("div",{key:oi,className:c,onClick:()=>{if(!qDone)setQAns(p=>({...p,[qi]:oi}))}},h("span",{style:{opacity:.4,flexShrink:0}},["A","B","C","D"][oi]+". "),o);
            }),
            qDone&&h("div",{className:"expl"},q.explanation)

            !qDone

            h("div",{className:"usage-fill",style:{width:(usageToday/FREE_DAILY_LIMIT*100)+"%",background:usageToday>40?"#EF4444":usageToday>30?"#F0C84A":"#10B981"}})
          ),
          h("span",null,usageToday+" / "+FREE_DAILY_LIMIT+" meddelanden"),

        ),
        h("div",{className:"stat-grid"},
          [{n:xp,l:t("totalXP")},{n:lessonCount,l:"Lektioner"},{n:subjects.length,l:"Ämnen"},{n:correctCount,l:t("correctAnswers")}]

        ),
        subjects.length>0&&h("div",{style:{background:"#fff",border:"1px solid #E3E8F5",borderRadius:16,padding:16,marginBottom:16}},
          h("div",{className:"sec-title",style:{margin:"0 0 12px"}},t("masteryPerSub")),
          subjects.map(s=>h("div",{key:s.id,style:{display:"flex",alignItems:"center",gap:10,marginBottom:10,cursor:"pointer"},onClick:()=>{setActive(s);setTab("subject")}},
            h("div",{style:{fontSize:18,flexShrink:0}},s.emoji),
            h("div",{style:{flex:1,minWidth:0}},
              h("div",{style:{fontSize:".82rem",fontWeight:600,marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},s.name),

          h("div",{style:{fontSize:".74rem",color:"#6B74A2",marginBottom:12}},user?.email),
          h("button",{className:"btn-s",style:{width:"100%",marginBottom:8,display:"block",textAlign:"left"},onClick:()=>setShowLang(true)},"🌍 "+t("languageLabel")+": "+lang),
          h("button",{className:"btn-s",style:{width:"100%",marginBottom:8,display:"block",textAlign:"left"},onClick:()=>setShowUpgrade(true)},t("upgradePlan")),
          h("button",{className:"btn-r",style:{width:"100%",display:"block"},onClick:signOut},"Logga ut")
        )
      ),

      // ── MODALS ────────────────────────────────────────────────────
      showNewSub&&h("div",{className:"overlay",onClick:()=>setShowNewSub(false)},
        h("div",{className:"sheet",onClick:e=>e.stopPropagation()},
          h("div",{className:"handle"}),
          h("div",{className:"sh-title"},t("newSubject")),
          h("span",{className:"lbl"},"Namn"),
          h("input",{type:"text",value:subName,onChange:e=>setSubName(e.target.value),placeholder:"t.ex. Anatomi, Historia, Fysik…",autoFocus:true}),

          h("span",{className:"lbl"},t("colorLabel")),

          h("button",{className:"btn-g",disabled:!subName.trim(),onClick:createSub},t("createSubBtn"))

      showAddMat&&h("div",{className:"overlay",onClick:()=>{if(!uploading&&!transcribing)setShowAddMat(false)}},

          h("div",{className:"handle"}),
          h("div",{className:"sh-title"},t("addMatTitle")),
          h("div",{className:"tab-row"},
            [{id:"file",l:"📄 "+t("fileTab")},{id:"paste",l:"✏️ "+t("textTab")},{id:"video",l:"▶️ "+t("videoTab")}].map(t=>
              h("button",{key:t.id,className:"tb "+(matTab===t.id?"on":""),onClick:()=>setMatTab(t.id)},t.l)
            )
          ),
          matTab==="file"&&(uploading
            ?h("div",{className:"loading-center",style:{padding:"40px 0"}},h("div",{className:"spin",style:{width:36,height:36,borderWidth:3}}),h("div",{style:{fontWeight:600,color:"#D4A017"}},"Bearbetar fil…"),h("div",{style:{fontSize:".78rem",color:"#6B74A2",marginTop:6}},"Extraherar text, vänta…"))

                h("div",{style:{fontSize:44,marginBottom:12}},"📁"),

                h("div",{style:{fontSize:".78rem",color:"#6B74A2"}},t("pdfDesc")),
                h("input",{ref:fileRef,type:"file",multiple:true,accept:"image/*,.pdf,.txt,.md",style:{display:"none"},onChange:onFile})

              h("div",{className:"info-box info-tip",style:{marginTop:12}},"📷 Bilder & diagram: AI kan se och förklara dem direkt.\n📄 PDF-text extraheras automatiskt."),
              h("div",{className:"info-box info-ok",style:{margin:"8px 0 0"}},"💡 Tips: För stora böcker, klistra in nyckelkapitlen i Text-fliken.")
            )
          ),
          matTab==="paste"&&h(F,null,
            h("input",{type:"text",value:pasteN,onChange:e=>setPasteN(e.target.value),placeholder:t("nameLabel")}),
            h("textarea",{value:pasteT,onChange:e=>setPasteT(e.target.value),placeholder:t("pasteHere"),style:{minHeight:160}}),
            h("button",{className:"btn-g",disabled:!pasteT.trim(),onClick:addPaste},t("saveText"))
          ),
          matTab==="video"&&h(F,null,
            h("input",{type:"text",value:vidUrl,onChange:e=>setVidUrl(e.target.value),placeholder:"https://youtube.com/watch?v=…"}),
            vidUrl&&getYouTubeId(vidUrl)&&h("div",{style:{marginBottom:14}},
              h("div",{style:{fontSize:".73rem",color:"#10B981",marginBottom:7,fontWeight:600}},t("ytDetected")),
              h(VideoPlayer,{url:vidUrl})
            ),
            transcribing&&h("div",{className:"info-box info-tip",style:{display:"flex",alignItems:"center",gap:8}},h("div",{className:"spin",style:{width:16,height:16,flexShrink:0}}),t("fetchingScript")),
            !transcribing&&h("div",{className:"info-box info-tip",style:{marginBottom:12}},"🎬 Lumio extraherar transkriptet så AI kan lära ut från videoinnehållet."),
            h("button",{className:"btn-g",disabled:!vidUrl.trim()||transcribing,onClick:addVid},transcribing?"Hämtar transkript…":t("addVideo"))
          )
        )
      ),

      showDel&&h("div",{className:"overlay",onClick:()=>setShowDel(null)},
        h("div",{className:"sheet",onClick:e=>e.stopPropagation()},
          h("div",{className:"handle"}),
          h("div",{style:{fontFamily:"Syne,sans-serif",fontSize:"1.1rem",color:"#EF4444",marginBottom:10}},t("deleteTitle")),
          h("p",{style:{fontSize:".87rem",color:"#6B74A2",marginBottom:22,lineHeight:1.65}},t("deleteWarn")),
          h("div",{style:{display:"flex",gap:8}},
            h("button",{className:"btn-s",style:{flex:1},onClick:()=>setShowDel(null)},t("cancel")),
            h("button",{className:"btn-r",style:{flex:1},onClick:()=>deleteSub(showDel)},t("deleteBtn"))
          )
        )
      ),

      // ── NAV ───────────────────────────────────────────────────────
      h("div",{className:"nav"},
        NAV.map(n=>{
          const isOn=tab===n.id||(tab==="subject"&&n.id==="subjects")||(isGamesTab&&n.id==="games");
          return h("button",{key:n.id,className:"ni "+(isOn?"on":""),onClick:()=>{
            window.speechSynthesis?.cancel();
            if(n.id==="subjects")setTab(active&&tab!=="subjects"?"subject":"subjects");
            else if(n.id==="lesson"){if(active){setTab("lesson");if(lState==="idle")initLumio();}else setTab("subjects")}
            else if(n.id==="dual"){if(active){setTab("dual");if(dState==="idle")initDual();}else setTab("subjects")}
            else if(n.id==="games"){setGameMode("menu");setTab("games");}
            else setTab(n.id);
          }},
            h("span",{className:"ni-ic"},n.ic),
            h("span",{className:"ni-lb"},t(n.id)||n.lb),
            n.id==="lesson"&&lState==="active"&&h("div",{className:"ni-dot"}),
            n.id==="dual"&&dState==="active"&&h("div",{className:"ni-dot"})
          );
        })
      )
    )
  );
}

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

</script>
